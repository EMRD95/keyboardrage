<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Game Over</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.dataset.infoTheme = localStorage.getItem('infoPageTheme') || 'night';</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" />
  <link rel="stylesheet" type="text/css" href="styles.css">
  <script src="info-page-theme.js" defer></script>
</head>
<body class="info-page">
  <header>
    <div class="header-container">
      <a href="/index.html" id="home-icon-link">
        <i class="fas fa-home"></i>
      </a>
      <a href="https://github.com/EMRD95/keyboardrage/" id="github-icon-link" target="_blank">
        <i class="fab fa-github"></i>
      </a>
      <a href="/faq.html" id="faq-link">
        <i class="fas fa-question-circle"></i>
        FAQ
      </a>
      <a href="/data-visualization.html" id="data-viz-link">
        <i class="fas fa-project-diagram"></i>
        Data Viz
      </a>
      <button type="button" id="info-theme-toggle" class="info-theme-toggle" aria-label="Switch to day theme" title="Switch theme">☀</button>
    </div>
  </header>

<div id="gameOverContainer">
  <h1>Game Over</h1>
  <div id="playerName"></div>
  <div id="score"></div>
  <div id="language"></div>
  <div id="WPM"></div>
  <div id="mode"></div>
  <div id="options"></div>
  <div id="precision"></div>
  <div id="timeElapsed"></div>
</div>


  <a id="play-again" href="/index.html" role="button">Play Again</a>
  <p id="play-again-quote" style="text-align:center;color:#888;font-style:italic;margin-top:6px;margin-bottom:20px">"True skill looks unskilled"</p>
  <hr style="width:60%;border:none;border-top:1px solid #333;margin:0 auto 18px">
	<h4 id="MotivationMessage">Practice mode, ranked modes are the WPM with a &#9733;</h4>
<h2 id="ScoreTitle">Top Scores <small id="ScoreSubtitle" class="small-text"></small></h2>
<table id="leaderboard">
  <tr>
    <th>Rank</th>
    <th>Player</th>
    <th>Score</th>
    <th>Mode</th>
    <th>Precision</th>
    <th>Date</th>
  </tr>
</table>

<div id="pagination">
  <button id="previous-page">Previous</button>
  <button id="next-page">Next</button>
</div>

<div id="motivationalMessage"></div>

<h2 id="LatestScoresTitle">Latest Scores <small id="LatestScoresSubtitle" class="small-text">For all games</small></h2>
<table id="latest-scores">
  <tr>
    <th>Player</th>
    <th>Score</th>
    <th>Mode</th>
    <th>Precision</th>
    <th>Date</th>
    <th>WPM</th>
    <th>Language</th>
  </tr>
</table>

<div id="pagination">
<button id="previous-page-latest-scores">Previous</button>
<button id="next-page-latest-scores">Next</button>
</div>

  <script src="game-over.js?v=info-page-20260523"></script>

</body>
</html>
