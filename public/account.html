<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Account — KeyboardRage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.dataset.infoTheme = localStorage.getItem('infoPageTheme') || 'night';</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" />
  <link rel="stylesheet" type="text/css" href="styles.css">
  <script src="nav-loader.js" defer></script>
</head>
<body class="info-page">

  <main style="max-width:500px;margin:60px auto;padding:0 20px;text-align:center">
    <h1 style="color:var(--info-heading);margin-bottom:8px;width:auto;text-align:center">Set Up Your Account</h1>
    <p id="setup-hint" style="color:var(--info-muted);font-size:0.9rem;margin-bottom:24px">
      Choose a display name — this is how you'll appear on leaderboards.
    </p>

    <div id="setup-form" style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <input type="text" id="display-name-input" placeholder="Display name (3–30 chars)"
        minlength="3" maxlength="30" autocomplete="off" autocapitalize="off" autocorrect="off"
        style="width:280px;padding:10px 14px;background:var(--info-panel-soft);border:1px solid var(--info-border);color:var(--info-text);border-radius:6px;font-size:1rem;text-align:center">
      <p id="setup-error" style="color:#f55;font-size:0.85rem;display:none;margin:0"></p>
      <button id="setup-submit" style="width:280px;padding:10px;background:var(--accent,#0f0);color:#000;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer">
        Save Display Name
      </button>
    </div>

    <div id="setup-done" style="display:none">
      <p style="color:var(--accent,#0f0);font-size:1.1rem;margin-bottom:16px">✓ Account ready!</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="/index.html" style="display:inline-block;padding:10px 28px;background:var(--accent,#0f0);color:#000;text-decoration:none;border-radius:6px;font-weight:600">
        Start Playing
      </a>
      <a href="/stats.html" style="display:inline-block;padding:10px 28px;background:var(--info-panel-soft);color:var(--info-text);text-decoration:none;border-radius:6px;font-weight:600;border:1px solid var(--info-border)">
        My Stats
      </a>
      <a href="/leaderboard.html" style="display:inline-block;padding:10px 28px;background:var(--info-panel-soft);color:var(--info-text);text-decoration:none;border-radius:6px;font-weight:600;border:1px solid var(--info-border)">
        🏆 Leaderboard
      </a>
      </div>
    </div>

    <p id="setup-email" style="color:var(--info-muted);font-size:0.8rem;margin-top:16px"></p>
  </main>

  <script type="module">
    import { initAuth, signOut, getSession, isLoggedIn, updateSessionFromAuthResponse } from './auth-client.js';

    function handleReady() {
      const session = getSession();
      if (!session) return;

      document.getElementById('setup-email').textContent = session.user.email;

      const signedIn = document.getElementById('auth-signed-in');
      if (signedIn) signedIn.style.display = 'flex';
      const avatar = document.getElementById('auth-avatar');
      if (avatar) avatar.src = session.user.picture || '';
      const display = document.getElementById('auth-display-name');
      if (display) display.textContent = session.user.name;
      const signout = document.getElementById('auth-signout');
      if (signout) signout.addEventListener('click', () => {
        signOut();
        window.location.href = '/index.html';
      });

      // Pre-fill with existing display name if set
      if (session.user.displayName) {
        document.getElementById('display-name-input').value = session.user.displayName;
        document.getElementById('setup-hint').textContent = 'Change your display name or re-save to refresh your session.';
      }

      // Setup form submit
      document.getElementById('setup-submit').addEventListener('click', async () => {
        const input = document.getElementById('display-name-input');
        const error = document.getElementById('setup-error');
        const name = input.value.trim();

        if (name.length < 3 || name.length > 30) {
          error.textContent = 'Display name must be 3–30 characters';
          error.style.display = 'block';
          return;
        }

        try {
          const res = await fetch('/auth/setup', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            credentials: 'same-origin',
            body: JSON.stringify({ displayName: name }),
          });

          const data = await res.json();
          if (!res.ok) {
            error.textContent = data.error || 'Failed to save';
            error.style.display = 'block';
            return;
          }

          // Update the public profile cache; the secret stays in the HttpOnly cookie.
          updateSessionFromAuthResponse(data);

          document.getElementById('setup-form').style.display = 'none';
          document.getElementById('setup-done').style.display = 'block';
        } catch (err) {
          error.textContent = 'Network error. Try again.';
          error.style.display = 'block';
        }
      });
    }

    // Auth may already be ready (nav-loader.js won the race).
    // If not, wait for the kr-auth-ready event.
    if (isLoggedIn()) {
      handleReady();
    } else {
      const onAuthReady = ({ detail }) => {
        if (!detail.loggedIn) {
          window.location.href = '/index.html';
          return;
        }
        handleReady();
      };
      window.addEventListener('kr-auth-ready', onAuthReady, { once: true });
    }

    initAuth();
  </script>
</body>
</html>
